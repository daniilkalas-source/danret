let room=null,call=null,cl=[];
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]};
const sig=(t,x={})=>room.emit('sig',{t,id:call.id,to:call.peer,from:uid,...x});
function showCall(st,inc){let d=$('#cu');if(!d){d=document.createElement('div');d.id='cu';d.style.cssText='position:fixed;inset:0;background:#111;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:70px 20px 50px;color:#fff';document.body.appendChild(d)}
 const n=uname(call.peer),v=call.kind==='video';
 d.innerHTML=`<video id="rv" autoplay playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:${v?'block':'none'}"></video><video id="lv" autoplay muted playsinline style="position:absolute;right:14px;top:60px;width:100px;border-radius:12px;display:${v?'block':'none'};z-index:2"></video><audio id="ra" autoplay></audio>
 <div style="z-index:1;text-align:center;text-shadow:0 1px 6px #000">${av(n,call.peer,110)}<h2>${E(n)}</h2><div id="cs">${st}</div></div>
 <div style="z-index:1;display:flex;gap:16px">${inc?'<button class="btn" id="ac" style="background:#34c759">Принять</button>':'<button class="btn" id="mt" style="background:#444">🎤 Микрофон</button>'}<button class="btn red" id="hg">${inc?'Отклонить':'Завершить'}</button></div>`;
 if(call.stream)$('#lv').srcObject=call.stream;if(call.remote){$('#rv').srcObject=call.remote;$('#ra').srcObject=call.remote}
 $('#hg').onclick=()=>{if(call.role==='b'&&!call.stream){sig('decline');endCall()}else{sig('end');endCall()}};
 if($('#mt'))$('#mt').onclick=()=>{const t=call.stream.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('#mt').textContent=t.enabled?'🎤 Микрофон':'🔇 Выключен'}};
 if($('#ac'))$('#ac').onclick=async()=>{try{call.stream=await media(call.kind)}catch(e){sig('decline');endCall();return toast('Нет доступа к микрофону/камере. Откройте Настройки → Разрешения.')}clearTimeout(call.tmo);showCall('Соединение…');sig('accept')}}
const media=k=>navigator.mediaDevices.getUserMedia({audio:true,video:k==='video'?{facingMode:'user'}:false});
function mkpc(){const pc=new RTCPeerConnection(ICE);call.pc=pc;call.stream.getTracks().forEach(t=>pc.addTrack(t,call.stream));
 pc.onicecandidate=e=>e.candidate&&call&&sig('ice',{c:e.candidate});
 pc.ontrack=e=>{call.remote=e.streams[0];if($('#rv'))$('#rv').srcObject=call.remote;if($('#ra'))$('#ra').srcObject=call.remote};
 pc.onconnectionstatechange=()=>{if(!call)return;const st=pc.connectionState;if(st==='connected'){call.t0=Date.now();call.ok=1;clearTimeout(call.tmo);if($('#cs'))$('#cs').textContent='Разговор'}if(st==='failed'){toast('Не удалось соединиться: сеть блокирует прямую связь');sig('end');endCall()}}}
function endCall(){if(!call)return;const c=call;call=null;clearTimeout(c.tmo);try{c.stream&&c.stream.getTracks().forEach(t=>t.stop());c.pc&&c.pc.close()}catch(e){}const d=$('#cu');if(d)d.remove();
 if(c.role==='a')db.collection('calls').doc(c.id).set({from:uid,to:c.peer,kind:c.kind,ts:Date.now(),dur:c.t0?Math.round((Date.now()-c.t0)/1000):0,st:c.ok?'ok':'missed'}).catch(()=>{})}
async function startCall(kind,peer){if(!room)return toast('Звонки недоступны');if(call)return toast('Уже идёт звонок');
 call={id:rid(8),peer,kind,role:'a',ice:[]};
 try{call.stream=await media(kind)}catch(e){call=null;return toast('Нет доступа к '+(kind==='video'?'камере или микрофону':'микрофону')+'. Откройте Настройки → Разрешения.')}
 showCall('Вызываем…');sig('ring',{kind});call.tmo=setTimeout(()=>{if(call&&!call.ok){sig('end');toast('Не отвечает');endCall()}},40000)}
async function onSig(d){
 if(d.t==='ring'){if(call){room.emit('sig',{t:'busy',id:d.id,to:d.from,from:uid});return}call={id:d.id,peer:d.from,kind:d.kind,role:'b',ice:[]};showCall('Входящий '+(d.kind==='video'?'видеозвонок':'аудиозвонок'),1);call.tmo=setTimeout(()=>{sig('decline');endCall()},45000);return}
 if(!call||d.id!==call.id)return;
 if(d.t==='accept'&&call.role==='a'){mkpc();const o=await call.pc.createOffer();await call.pc.setLocalDescription(o);sig('offer',{s:o})}
 else if(d.t==='offer'&&call.role==='b'){mkpc();await call.pc.setRemoteDescription(d.s);for(const x of call.ice)await call.pc.addIceCandidate(x).catch(()=>{});call.ice=[];const a=await call.pc.createAnswer();await call.pc.setLocalDescription(a);sig('answer',{s:a})}
 else if(d.t==='answer'&&call.pc){await call.pc.setRemoteDescription(d.s);for(const x of call.ice)await call.pc.addIceCandidate(x).catch(()=>{});call.ice=[]}
 else if(d.t==='ice'){call.pc&&call.pc.remoteDescription?call.pc.addIceCandidate(d.c).catch(()=>{}):call.ice.push(d.c)}
 else if(['end','busy','decline'].includes(d.t)){toast({busy:'Абонент занят',decline:'Звонок отклонён',end:'Звонок завершён'}[d.t]);endCall()}}
