const EMR=/\p{Extended_Pictographic}(?:\uFE0F|\p{Emoji_Modifier}|\u200D\p{Extended_Pictographic}\uFE0F?)*/gu;
function emoList(t){t=String(t||'').trim();if(!t||t.length>40)return null;const m=t.match(EMR);if(!m||m.length>3)return null;if(m.some(x=>x.codePointAt(0)<0x2000))return null;if(t.replace(EMR,'').trim())return null;return m}
function emoUrl(e,nf){let c=[...e].map(x=>x.codePointAt(0).toString(16));if(nf)c=c.filter(x=>x!=='fe0f');return 'https://fonts.gstatic.com/s/e/notoemoji/latest/'+c.join('_')+'/512.webp'}
function emoPre(e){try{const m=emoList(e);if(m)m.forEach(x=>{const i=new Image();i.decoding='async';i.src=emoUrl(x)})}catch(_){}}
const stSeen=new Set();
function popCls(m){if(!m||!m.id||stSeen.has(m.id))return '';stSeen.add(m.id);return (Date.now()-(+m.ts||0)<5000)?' pp2':''}
function emoH(l,m){const sz=l.length===1?124:l.length===2?88:68;return `<span class="emo${popCls(m)}">${l.map(e=>`<img class="emoi" src="${emoUrl(e)}" data-e="${E(e)}" alt="${E(e)}" width="${sz}" height="${sz}" decoding="async" draggable="false">`).join('')}</span>`}
function stkEl(it,cls){return it.t==='l'?`<div class="lotm ${cls||''}" data-lot="${E(it.u)}"></div>`:`<img class="${cls||''}" src="${E(it.u)}" alt="" draggable="false">`}
function stH(m){if(m.kind==='sticker'&&m.u){const pc=popCls(m);return m.lt?`<div class="lotm stkm${pc}" data-lot="${E(m.u)}"></div>`:`<img class="stkm${pc}" src="${E(m.u)}" alt="" draggable="false" decoding="async">`}
 const l=(!m.kind||m.kind==='text')?emoList(m.text):null;return l?emoH(l,m):LK(m.text)}
document.addEventListener('error',e=>{const i=e.target;if(!i||!i.classList||!i.classList.contains('emoi'))return;
 if(!i.dataset.r1&&i.src.includes('_fe0f')){i.dataset.r1=1;i.src=emoUrl(i.dataset.e,1);return}

function lotMount(el){if(el.dataset.lm)return;el.dataset.lm=1;
 Promise.all([lotLib(),fetch(el.dataset.lot).then(r=>r.json())]).then(([L,j])=>{if(!el.isConnected)return;L.loadAnimation({container:el,renderer:'svg',loop:true,autoplay:true,animationData:j})}).catch(()=>{el.textContent='🖼'})}
new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType!==1)continue;if(n.matches&&n.matches('[data-lot]'))lotMount(n);if(n.querySelectorAll)n.querySelectorAll('[data-lot]:not([data-lm])').forEach(lotMount)}}).observe(document.documentElement,{childList:true,subtree:true});

const b64=t=>btoa(unescape(encodeURIComponent(t)));
function rdText(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsText(f)})}
function rdUrl(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
async function stkFromFile(f){
 const nm=(f.name||'').toLowerCase();
 if(nm.endsWith('.json')||f.type==='application/json'){const t=await rdText(f);let j;try{j=JSON.parse(t)}catch(e){throw new Error('Битый Lottie-файл')}
  if(!j||!Array.isArray(j.layers))throw new Error('Это не Lottie-анимация');if(t.length>600000)throw new Error('Lottie слишком тяжёлый (до 600 КБ)');
  return {t:'l',u:'data:application/json;base64,'+b64(JSON.stringify(j))}}
 if(nm.endsWith('.svg')||f.type==='image/svg+xml'){const t=await rdText(f);if(t.length>200000)throw new Error('SVG слишком тяжёлый');return {t:'i',u:'data:image/svg+xml;base64,'+b64(t)}}
 if(!f.type.startsWith('image/'))throw new Error('Нужна картинка, SVG или Lottie');
 const raw=await rdUrl(f);
 if(f.type==='image/gif'&&raw.length<400000)return {t:'i',u:raw};
 const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('Не удалось открыть картинку'));i.src=raw});
 const k=Math.min(1,384/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.width*k));cv.height=Math.max(1,Math.round(img.height*k));
 cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
 return {t:'i',u:cv.toDataURL('image/png')}
}

function packCreator(done){
 const ov=document.createElement('div');ov.className='pkv';

 const close=()=>ov.remove();

 const paint=()=>{
  const cv=cover||items[0]||null;
  ov.innerHTML=`<div class="pkd"><div class="pkh"><b>Новый стикерпак</b><button class="pkx" id="pkx">✕</button></div>
  <div class="pkcv" id="pkcv">${cv?stkEl(cv):'<span>🖼</span>'}</div><div class="pkhint">Нажмите на обложку, чтобы заменить</div>
  <input class="pkn" id="pkn" maxlength="40" placeholder="Название набора" value="${E(name)}">
  <div class="pkl"><b>Стикеры в наборе</b><span>${items.length}</span></div>
  <div class="pkhint l">Перетащите SVG / Lottie сюда или нажмите ＋</div>
  <div class="pkg">${items.map((it,i)=>`<div class="pki">${stkEl(it)}<button class="pkr" data-r="${i}">✕</button></div>`).join('')}<button class="pka" id="pka"><span>＋</span>Добавить</button></div>
  <div class="pkb"><button class="pkc" id="pkc">Отмена</button><button class="pko" id="pko">Создать</button></div></div>`;
  const d=ov.querySelector('.pkd');
  ov.querySelector('#pkx').onclick=ov.querySelector('#pkc').onclick=close;
  ov.querySelector('#pkn').oninput=e=>{name=e.target.value};
  ov.querySelector('#pka').onclick=()=>pickFiles(true,addFiles);
  ov.querySelector('#pkcv').onclick=()=>pickFiles(false,async fs=>{try{cover=await stkFromFile(fs[0]);paint()}catch(e){toast(e.message||'Ошибка файла')}});
  ov.querySelectorAll('.pkr').forEach(b=>b.onclick=()=>{const it=items.splice(+b.dataset.r,1)[0];if(cover===it)cover=null;paint()});
  ov.querySelector('#pko').onclick=()=>{
   name=ov.querySelector('#pkn').value.trim();
   if(!name)return toast('Введите название набора');
   if(!items.length)return toast('Добавьте хотя бы один стикер');
   const pk={n:name,cv:cover||items[0],s:items},all=stkLoad();all.push(pk);
   if(!stkSave(all))return;close();done(pk)};
  d.ondragover=e=>{e.preventDefault();d.classList.add('pkdg')};d.ondragleave=()=>d.classList.remove('pkdg');
  d.ondrop=e=>{e.preventDefault();d.classList.remove('pkdg');addFiles([...e.dataTransfer.files])};
 };

 paint();document.body.appendChild(ov);
