 if(d.t==='accept'&&call.role==='a'){mkpc();const o=await call.pc.createOffer();await call.pc.setLocalDescription(o);sig('offer',{s:o})}

 const draw=()=>{d.innerHTML=`<div class="top"><button class="ib" id="prx"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div class="t">Конфиденциальность</div><div style="width:38px"></div></div><div class="main" style="padding-bottom:40px"><div class="lbl">Конфиденциальность</div><div class="grp">${tg('hide',!me.hide,'Показывать меня в поиске')}<div class="row k" id="slv"><div class="col">Был(а) в сети</div><span class="sub">${VL[me.seenVis||'all']} ›</span></div><div class="row k" id="pv"><div class="col">Номер телефона</div><span class="sub">${VL[me.phoneVis]||'Никто'} ›</span></div><div class="row k" id="bdv"><div class="col">Дата рождения</div><span class="sub">${VL[me.bdVis||'contacts']} ›</span></div><div class="row k" id="pfv"><div class="col">Фото профиля</div><span class="sub">${VL[me.phVis||'all']} ›</span></div></div><div class="lbl">Аккаунт</div><div class="grp"><div class="row k" id="pm">${ico('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>')}<div class="col">Разрешить микрофон и камеру</div></div><div class="row k" id="lo">${ico('<path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/>')}<div class="col">Выйти из аккаунта</div></div><div class="row k" id="del" style="color:#e5484d">Удалить аккаунт</div></div></div>`;
  const q=x=>d.querySelector(x);
  q('#prx').onclick=()=>{d.remove();prD=null};
  d.querySelectorAll('[data-tg]').forEach(x=>x.onclick=()=>{const k=x.dataset.tg;me[k]=!me[k];setU({[k]:me[k]});draw()});
  q('#slv').onclick=()=>{const v0=me.seenVis||'all',w=sheet(hd('Был(а) в сети')+`<div class="sub">Кто видит время вашего последнего посещения. Остальные увидят «был(а) недавно».</div><div class="seg">${[['all','Все'],['contacts','Контакты'],['none','Никто']].map(([k,v])=>`<button data-v="${k}" class="${v0===k?'on':''}">${v}</button>`).join('')}</div>`);w.style.zIndex=9;w.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{me.seenVis=b.dataset.v;setU({seenVis:b.dataset.v});w.remove();draw()})};
  q('#pv').onclick=()=>visSheet('Номер телефона','phoneVis','none',(myPh?'':'Сначала укажите номер в профиле. ')+'Кто видит ваш номер в профиле. «Контакты» — те, кого вы добавили в контакты.',v=>({phone:v==='none'?'':myPh}),draw);
  q('#pfv').onclick=()=>visSheet('Фото профиля','phVis','all','Кто видит ваше фото профиля. Остальные увидят букву вместо фото.',null,draw);q('#bdv').onclick=()=>visSheet('Дата рождения','bdVis','contacts','Кто видит вашу дату рождения в профиле.',null,draw);
  q('#pm').onclick=askPerm;
  q('#lo').onclick=()=>ask('Выйти из аккаунта?',()=>fbAuth.signOut(),'Выйти');
  q('#del').onclick=()=>ask('Удалить аккаунт?',async()=>{await db.collection('users').doc(uid).delete();try{await fbAuth.currentUser.delete()}catch(e){await fbAuth.signOut()}})};
 document.body.appendChild(d);draw();prD=draw}
let prD=null;
function myProfile(){const d=document.createElement('div');d.className='srv pf';
 const draw=()=>{d.innerHTML=`${phs(uid)}<div class="main"><div class="phd" style="${pcBg(uid)}"><div class="top" style="background:none"><button class="ib" id="mpx"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div class="t"></div><button class="pill" id="mpe">Изм.</button></div><div class="hero" style="padding:0 20px 16px">${avH(me.name,uid,110,'mp')}<h1>${E(me.name)}</h1><div class="sub">в сети</div></div></div><div class="grp" style="margin-top:14px">${myPh?`<div class="fld"><b>мобильный</b><span style="color:var(--ac)">${E(myPh)}</span></div>`:''}<div class="fld"><b>имя пользователя</b><span style="color:var(--ac)">@${E(me.username)}</span></div>${me.bd?`<div class="fld"><b>день рождения</b><span>${fmtBd(me.bd)}</span></div>`:''}${me.bio?`<div class="fld"><b>о себе</b><span>${E(me.bio)}</span></div>`:''}</div><div class="seg" style="margin:14px"><button class="on">Публикации</button></div><div style="display:flex;gap:10px;justify-content:center;padding:0 14px 10px"><span class="pill">Все истории</span><button class="pill" id="mpa" style="color:var(--tx)">+ История</button><button class="pill" id="mpc" style="color:var(--tx)">Цвет</button></div>${pubGrid(uid)}</div>`;
  d.querySelector('#mpx').onclick=()=>d.remove();d.querySelector('#mpe').onclick=editProfile;d.querySelector('#mpa').onclick=addStory;d.querySelector('#mpc').onclick=colorPage;pullAva(d);pubX(d)};
 document.body.appendChild(d);draw();mpD=()=>{if(!document.body.contains(d)){mpD=null;return}draw()}}
function editProfile(){const d=document.createElement('div');d.className='srv';const st={n:me.name,b:me.bio||'',d:me.bd||''},BV={all:'виден всем',contacts:'виден контактам',none:'скрыт от всех'},sh=v=>{const [y,m,x]=v.split('-').map(Number);return x+' '+MON[m-1]+' '+y},ic=(bg,p)=>`<span style="background:${bg};color:#fff;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none"><svg class="i" viewBox="0 0 24 24">${p}</svg></span>`;
 const draw=()=>{d.innerHTML=`<div class="top" style="background:none"><button class="ib" id="epx"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="t"></div><button class="ib" id="eps" style="background:var(--ac);color:#fff"><svg class="i" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></button></div><div class="main"><div style="text-align:center;padding:6px 0 14px"><div id="epa" style="display:flex;justify-content:center;cursor:pointer">${av(me.name,uid,130)}</div><div id="epc" style="color:var(--ac);font-size:20px;margin-top:14px;cursor:pointer">Изменить фотографию</div></div>
 <div class="grp" style="padding:4px 12px"><input id="en" value="${E(st.n)}" placeholder="Имя" maxlength="40" style="background:none;border:0;margin:0"></div><div class="sub" style="padding:6px 20px 16px">Укажите имя и, если хотите, добавьте фотографию для вашего профиля.</div>
 <div class="grp" style="padding:4px 12px"><textarea id="eb" rows="2" placeholder="О себе" maxlength="200" style="background:none;border:0;margin:0">${E(st.b)}</textarea></div><div class="sub" style="padding:6px 20px 16px">Напишите несколько строк о себе.</div>
 <div class="grp"><div class="row" style="position:relative">${ic('#3b82f6','<path d="M4 21h16M5 21v-7h14v7M5 14c2-2 3 1 5-1s3 1 5-1 3 1 4 0M12 10V7"/>')}<div class="col nm">День рождения</div><span class="sub" id="bdt">${st.d?sh(st.d):'Не указан'}</span><input type="date" id="ebd" value="${st.d}" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0"></div></div><div class="sub" style="padding:6px 20px 16px">Ваш день рождения ${BV[me.bdVis||'contacts']}. <span id="ebv" style="color:var(--ac);cursor:pointer">Изменить ›</span></div>
 <div class="grp"><div class="row k" id="eph">${ic('#34c759','<path d="M6.6 10.8a15 15 0 006.6 6.6l2.2-2.2a1 1 0 011-.25c1.1.37 2.3.57 3.6.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1z"/>')}<div class="col nm">Номер</div><span class="sub">${E(myPh||'Не указан')} ›</span></div><div class="row">${ic('#6366f1','<circle cx="12" cy="12" r="4"/><path d="M16 12v1.5a2.5 2.5 0 005 0V12a9 9 0 10-3.5 7"/>')}<div class="col nm">Имя пользователя</div><span class="sub">@${E(me.username)}</span></div></div></div>`;
  const q=x=>d.querySelector(x);q('#epx').onclick=()=>d.remove();
  q('#en').oninput=e=>st.n=e.target.value;q('#eb').oninput=e=>st.b=e.target.value;
  q('#ebd').onchange=e=>{st.d=e.target.value;q('#bdt').textContent=st.d?sh(st.d):'Не указан'};
  q('#ebv').onclick=()=>visSheet('Дата рождения','bdVis','contacts','Кто видит вашу дату рождения в профиле.',null,draw);
  q('#epa').onclick=q('#epc').onclick=()=>pickImg(async id=>{await setU({ph:id});draw()});
  q('#eph').onclick=()=>{let pv=me.phoneVis||'none';const w=sheet(hd('Номер телефона')+`<input id="epi" type="tel" value="${E(myPh)}" placeholder="+7 …"><div class="sub" style="margin:8px 0">Кто видит номер в профиле:</div><div class="seg">${['all','contacts','none'].map(x=>`<button data-v="${x}" class="${pv===x?'on':''}">${VL[x]}</button>`).join('')}</div><button class="btn" id="epk" style="width:100%;margin-top:12px">Сохранить</button>`);w.style.zIndex=9;w.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{pv=b.dataset.v;w.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b))});w.querySelector('#epk').onclick=async()=>{const v=w.querySelector('#epi').value.trim();try{await db.collection('data/users/'+uid).doc('phone').set({v});myPh=v;await setU({phoneVis:pv,phone:pv==='none'?'':v})}catch(e){toast('Не удалось сохранить')}w.remove();draw()}};
  q('#eps').onclick=async()=>{try{await setU({name:st.n.trim()||me.name,bio:st.b.trim(),bd:st.d||''});toast('Профиль сохранён')}catch(e){toast('Не удалось сохранить')}d.remove();mpD&&mpD()}};
 document.body.appendChild(d);draw()}
init();
</script>
<style>.cap{padding:6px 2px 0;font-size:16px;white-space:pre-wrap;word-break:break-word}.dnut{width:200px;height:200px;border-radius:50%;margin:8px auto;display:flex;align-items:center;justify-content:center}.dnut b{width:130px;height:130px;border-radius:50%;background:var(--bg,#000);display:flex;align-items:center;justify-content:center;font-size:24px}</style>
<script>
const MC='danret-media',trf=n=>{try{localStorage.dmTraf=(+localStorage.dmTraf||0)+n}catch(e){}};
const isAdm=()=>chats.some(c=>c.type==='channel'&&String(c.link||'').toLowerCase()==='danretofficial'&&c.owner===uid);
const mb=n=>n>=1e9?(n/1e9).toFixed(1)+' ГБ':n>=1e6?(n/1e6).toFixed(1)+' МБ':Math.round(n/1e3)+' КБ';
function capSend(f){return mediaSheet([f]);}
function capSendOld(f){const im=f.type.startsWith('image/'),u=URL.createObjectURL(f),st='max-width:100%;max-height:260px;border-radius:12px';const s=sheet(hd('Отправить')+`<div style="text-align:center">${im?`<img src="${u}" style="${st}">`:`<video src="${u}#t=0.1" muted playsinline style="${st}"></video>`}</div><input id="cpt" placeholder="Добавить подпись…" maxlength="1000" style="margin-top:10px"><button class="btn" id="cps" style="width:100%;margin-top:10px">Отправить</button>`);s.querySelector('#cps').onclick=()=>{const t=s.querySelector('#cpt').value.trim();s.remove();upMedia(f,null,t).catch(e=>toast('Ошибка: '+(e.message||e.code||e)))}}
async function memInfo(){const t={v:0,a:0,p:0,o:0};try{const c=await caches.open(MC);for(const q of await c.keys()){const r=await c.match(q),ct=r.headers.get('content-type')||'',n=+(r.headers.get('content-length')||0)||(await r.blob()).size;t[ct.startsWith('video')?'v':ct.startsWith('audio')?'a':ct.startsWith('image')?'p':'o']+=n}}catch(e){}return t}
function dataPage(){const on=localStorage.dmAuto!=='0',w=pgs(hp('Данные и память')+`<div class="grp"><div class="row k" id="dmu"><div class="col">Использование памяти</div><span class="sub" id="dmv">…</span> ›</div><div class="row k"><div class="col">Использование трафика</div><span class="sub">${mb(+localStorage.dmTraf||0)}</span></div></div><div class="grp"><div class="row" style="border:0"><div class="col">Автозагрузка видео</div><button class="sw ${on?'on':''}" id="dmw"></button></div></div><div class="sub" style="padding:0 14px">Просмотренные видео и голосовые сохраняются на устройстве, чтобы открываться без интернета.</div>${isAdm()?`<div class="sub" style="line-height:1.7;margin:12px 14px">Чатов: ${mine().length}<br>Пользователей: ${Object.keys(users).length}<br>Историй: ${stl.length}</div>`:''}<button class="btn" id="rl" style="width:100%;margin-top:12px">Обновить приложение</button>`);memInfo().then(t=>{const e=w.querySelector('#dmv');if(e)e.textContent=mb(t.v+t.a+t.p+t.o)});w.querySelector('#dmw').onclick=ev=>{const b=ev.currentTarget;b.classList.toggle('on');localStorage.dmAuto=b.classList.contains('on')?'1':'0'};w.querySelector('#rl').onclick=()=>location.reload();w.querySelector('#dmu').onclick=memPage}
async function memPage(){const t=await memInfo(),tot=t.v+t.a+t.p+t.o,C=[['v','Видео','#4a78e8'],['a','Голосовые','#f09a37'],['p','Фотографии','#6ec3f4'],['o','Прочее','#5cc863']];let a=0;const g=tot?C.map(([k,,c])=>{const p=t[k]/tot*100,r=`${c} ${a}% ${a+p}%`;a+=p;return r}).join(','):'#333 0 100%';const w=pgs(hp('Использование памяти')+`<div class="dnut" style="background:conic-gradient(${g})"><b>${mb(tot)}</b></div><div class="grp">${C.map(([k,n,c])=>`<div class="row" style="border:0"><span style="color:${c}">●</span><div class="col">${n} <span class="sub">${tot?Math.round(t[k]/tot*100):0}%</span></div><span class="sub">${mb(t[k])}</span></div>`).join('')}<button class="btn" id="cc" style="width:100%;margin:10px 0">Очистить весь кэш ${mb(tot)}</button></div><div class="sub" style="padding:0 14px">Все медиа останутся в облаке Danret, при необходимости вы сможете загрузить их снова.</div>`);w.querySelector('#cc').onclick=async()=>{await caches.delete(MC);document.querySelectorAll('video[data-mc]').forEach(v=>delete v.dataset.mc);w.remove();toast('Кэш очищен, освобождено '+mb(tot))}}
async function scanMedia(){if(!window.caches)return;const c=await caches.open(MC);document.querySelectorAll('video[src^="https"]').forEach(async v=>{const u=v.getAttribute('src');if(v.dataset.mc||!/firebasestorage|storage\.googleapis/.test(u))return;v.dataset.mc=1;const r=await c.match(u);if(r){const p=v.currentTime;v.src=URL.createObjectURL(await r.blob());v.currentTime=p;return}if(localStorage.dmAuto==='0')return;v.addEventListener('play',async()=>{try{if(await c.match(u))return;const f=await fetch(u);if(!f.ok)return;trf(+(f.headers.get('content-length')||0));await c.put(u,f)}catch(e){}},{once:true})})}
let mto;new MutationObserver(()=>{clearTimeout(mto);mto=setTimeout(scanMedia,400)}).observe(document.getElementById('app'),{childList:true,subtree:true});
</script>
